name: Build Tiny11 ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tiny11:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get build date
        id: buildmeta
        shell: powershell
        run: |
          $date = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          "build_date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download Windows 11 ISO using Fido
        id: iso
        shell: powershell
        run: |
          $isoPath = Join-Path $env:TEMP "Windows11_latest.iso"
          $fidoScript = Join-Path $env:TEMP "Fido.ps1"

          Write-Host "Downloading Fido script..."
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/pbatard/Fido/master/Fido.ps1" `
            -OutFile $fidoScript `
            -UseBasicParsing `
            -ErrorAction Stop

          Write-Host "Getting Windows 11 ISO URL..."
          $url = & powershell -ExecutionPolicy Bypass -File $fidoScript `
            -Win 11 `
            -Rel Latest `
            -Ed "Windows 11 Home/Pro/Edu" `
            -Lang English `
            -Arch x64 `
            -GetUrl

          if (-not $url) {
            throw "Failed to get Windows 11 ISO URL from Fido"
          }

          Write-Host "ISO URL obtained, downloading..."
          Invoke-WebRequest -Uri $url `
            -OutFile $isoPath `
            -UseBasicParsing `
            -ErrorAction Stop

          if (Test-Path $isoPath) {
            $size = (Get-Item $isoPath).Length / 1GB
            Write-Host "ISO downloaded successfully. Size: $([math]::Round($size, 2)) GB"
            "iso_path=$isoPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            throw "ISO was not downloaded."
          }

      - name: Mount ISO and get drive letter
        id: mount
        shell: powershell
        run: |
          $isoPath = "${{ steps.iso.outputs.iso_path }}"
          Write-Host "Mounting ISO from: $isoPath"

          $mount = Mount-DiskImage -ImagePath $isoPath -PassThru
          Start-Sleep -Seconds 2

          $drive = ($mount | Get-Volume).DriveLetter

          if (-not $drive) {
            throw "Could not determine ISO drive letter."
          }

          "drive_letter=$drive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Mounted ISO to drive letter: $drive"

      - name: Build tiny11 ISO
        shell: powershell
        run: |
          $driveLetter = "${{ steps.mount.outputs.drive_letter }}"
          $outputDir = Join-Path $env:TEMP "tiny11-output"
          $scratchDir = Join-Path $env:TEMP "tiny11-scratch"

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          New-Item -ItemType Directory -Path $scratchDir -Force | Out-Null

          Write-Host "Running tiny11maker..."
          Write-Host "ISO Drive: $driveLetter"
          Write-Host "Scratch Dir: $scratchDir"
          Write-Host "Output Dir: $outputDir"

          & powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tiny11maker.ps1" `
            -ISO $driveLetter `
            -SCRATCH $scratchDir `
            -OutputPath "$outputDir\tiny11.iso" `
            -NonInteractive `
            -SkipAdminPrompt

          if (Test-Path "$outputDir\tiny11.iso") {
            $size = (Get-Item "$outputDir\tiny11.iso").Length / 1GB
            Write-Host "tiny11.iso created successfully. Size: $([math]::Round($size, 2)) GB"
            "tiny11_iso=$outputDir\tiny11.iso" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "WARNING: tiny11.iso not found."
            "tiny11_iso=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build tiny11core ISO
        shell: powershell
        run: |
          $driveLetter = "${{ steps.mount.outputs.drive_letter }}"
          $outputDir = Join-Path $env:TEMP "tiny11-output"
          $scratchDir = Join-Path $env:TEMP "tiny11-scratch"

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          New-Item -ItemType Directory -Path $scratchDir -Force | Out-Null

          Write-Host "Running tiny11coremaker..."
          Write-Host "ISO Drive: $driveLetter"
          Write-Host "Scratch Dir: $scratchDir"
          Write-Host "Output Dir: $outputDir"

          & powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tiny11Coremaker.ps1" `
            -ISO $driveLetter `
            -SCRATCH $scratchDir `
            -OutputPath "$outputDir\tiny11core.iso" `
            -NonInteractive `
            -SkipAdminPrompt

          if (Test-Path "$outputDir\tiny11core.iso") {
            $size = (Get-Item "$outputDir\tiny11core.iso").Length / 1GB
            Write-Host "tiny11core.iso created successfully. Size: $([math]::Round($size, 2)) GB"
            "tiny11core_iso=$outputDir\tiny11core.iso" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "WARNING: tiny11core.iso not found."
            "tiny11core_iso=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Dismount ISO
        if: always()
        shell: powershell
        run: |
          try {
            $isoPath = "${{ steps.iso.outputs.iso_path }}"
            if (Test-Path $isoPath) {
              Dismount-DiskImage -ImagePath $isoPath -Confirm:$false
              Write-Host "ISO dismounted"
            }
          } catch {
            Write-Host "ISO already dismounted or error during dismount: $_"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: releases
          name: tiny11 - ${{ steps.buildmeta.outputs.build_date }}
          draft: false
          prerelease: false
          files: |
            ${{ env.tiny11_iso }}
            ${{ env.tiny11core_iso }}

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up temporary files..."
          Remove-Item -Path "$env:TEMP\Windows11_latest.iso" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\Fido.ps1" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\tiny11-output" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\tiny11-scratch" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup complete"
