name: Build Tiny11 ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tiny11:
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get build date
        id: buildmeta
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          "build_date=$date" >> $env:GITHUB_OUTPUT

      - name: Download Windows 11 ISO using Fido
        id: iso
        shell: pwsh
        run: |
          $isoPath = Join-Path $env:TEMP "Windows11_latest.iso"
          $fidoScript = Join-Path $env:TEMP "Fido.ps1"

          Write-Host "Downloading Fido script..."
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/pbatard/Fido/master/Fido.ps1" `
            -OutFile $fidoScript `
            -UseBasicParsing `
            -ErrorAction Stop

          Write-Host "Resolving Windows 11 ISO URL..."
          $url = & powershell -NoProfile -ExecutionPolicy Bypass -File $fidoScript `
            -Win 11 `
            -Rel Latest `
            -Ed "Windows 11 Home/Pro/Edu" `
            -Lang "English" `
            -Arch x64 `
            -GetUrl

          if (-not $url) {
            throw "Failed to get Windows 11 ISO URL from Fido"
          }

          Write-Host "Downloading ISO..."
          Invoke-WebRequest -Uri $url -OutFile $isoPath -UseBasicParsing -ErrorAction Stop

          if (-not (Test-Path $isoPath)) {
            throw "ISO was not downloaded."
          }

          "iso_path=$isoPath" >> $env:GITHUB_OUTPUT
          Write-Host "ISO downloaded successfully: $isoPath"

      - name: Mount ISO and resolve drive letter
        id: mount
        shell: pwsh
        run: |
          $isoPath = "${{ steps.iso.outputs.iso_path }}"
          Write-Host "Mounting ISO: $isoPath"

          $mounted = Mount-DiskImage -ImagePath $isoPath -PassThru -ErrorAction Stop

          $drive = $null
          for ($i = 0; $i -lt 30; $i++) {
            $volume = Get-DiskImage -ImagePath $isoPath | Get-Volume -ErrorAction SilentlyContinue
            if ($volume -and $volume.DriveLetter) {
              $drive = "$($volume.DriveLetter):"
              break
            }
            Start-Sleep -Seconds 2
          }

          if (-not $drive) {
            throw "Could not determine ISO drive letter."
          }

          "drive_letter=$drive" >> $env:GITHUB_OUTPUT
          Write-Host "Mounted ISO to drive letter: $drive"

      - name: Build tiny11 ISO
        shell: pwsh
        run: |
          $driveLetter = "${{ steps.mount.outputs.drive_letter }}"
          $outputDir = Join-Path $env:TEMP "tiny11-output"
          $scratchDir = Join-Path $env:TEMP "tiny11-scratch"

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          New-Item -ItemType Directory -Path $scratchDir -Force | Out-Null

          $params = @{
            ISO = $driveLetter.TrimEnd(":")
            SCRATCH = $scratchDir
            OutputPath = Join-Path $outputDir "tiny11.iso"
            NonInteractive = $true
            SkipAdminPrompt = $true
          }

          Write-Host "Running tiny11maker..."
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tiny11maker.ps1" @params

          if (-not (Test-Path (Join-Path $outputDir "tiny11.iso"))) {
            throw "tiny11.iso was not created."
          }

          "tiny11_iso=$((Join-Path $outputDir "tiny11.iso"))" >> $env:GITHUB_ENV

      - name: Build tiny11core ISO
        shell: pwsh
        run: |
          $driveLetter = "${{ steps.mount.outputs.drive_letter }}"
          $outputDir = Join-Path $env:TEMP "tiny11-output"
          $scratchDir = Join-Path $env:TEMP "tiny11-scratch"

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          New-Item -ItemType Directory -Path $scratchDir -Force | Out-Null

          $params = @{
            ISO = $driveLetter.TrimEnd(":")
            SCRATCH = $scratchDir
            OutputPath = Join-Path $outputDir "tiny11core.iso"
            NonInteractive = $true
            SkipAdminPrompt = $true
          }

          Write-Host "Running tiny11coremaker..."
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tiny11Coremaker.ps1" @params

          if (-not (Test-Path (Join-Path $outputDir "tiny11core.iso"))) {
            throw "tiny11core.iso was not created."
          }

          "tiny11core_iso=$((Join-Path $outputDir "tiny11core.iso"))" >> $env:GITHUB_ENV

      - name: Dismount ISO
        if: always()
        shell: pwsh
        run: |
          $isoPath = "${{ steps.iso.outputs.iso_path }}"
          try {
            if (Test-Path $isoPath) {
              Dismount-DiskImage -ImagePath $isoPath -Confirm:$false | Out-Null
              Write-Host "ISO dismounted"
            }
          }
          catch {
            Write-Host "ISO already dismounted or error during dismount: $($_.Exception.Message)"
          }

      - name: Publish GitHub Release
        if: ${{ env.tiny11_iso != '' && env.tiny11core_iso != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: releases
          name: tiny11 - ${{ steps.buildmeta.outputs.build_date }}
          draft: false
          prerelease: false
          files: |
            ${{ env.tiny11_iso }}
            ${{ env.tiny11core_iso }}

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Write-Host "Cleaning up temporary files..."
          Remove-Item -Path "$env:TEMP\Windows11_latest.iso" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\Fido.ps1" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\tiny11-output" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\tiny11-scratch" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup complete"
